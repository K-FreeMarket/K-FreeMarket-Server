version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wjd15sheep792/kfreemarket-server:latest
    container_name: kfreemarket-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: kfreemarket-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: kfreemarket
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
