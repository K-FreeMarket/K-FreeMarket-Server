<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/common :: head('hello K-FreeMarket')">
    <meta charset="UTF-8" />

    <title>weclome</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link href="globals.css" rel="stylesheet" />
  </head>
  <body class="min-vh-100">
    <div class="min-vh-100">
      <div class="row min-vh-100 g-0">
        <!-- 왼쪽: 검정 배경, 흰 글씨 -->
        <div
          class="col-12 col-md-6 d-flex align-items-center justify-content-center bg-dark text-white"
        >
          <h1 class="m-0">K-FreeMarket</h1>
        </div>

        <!-- 오른쪽: 로그인 -->
        <div
          class="col-12 col-md-6 d-flex align-items-center justify-content-center"
        >
          <div class="w-75" style="max-width: 420px">
            <h2 class="mb-4 text-center">로그인</h2>
            <form th:action="@{/login}" method="post" class="mt-4">
              <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
              />
              <div class="mb-3">
                <label class="form-label">아이디</label>
                <input
                  type="text"
                  name="username"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  required
                />
              </div>
              <button type="submit" class="btn btn-dark w-100">로그인</button>

              <div th:if="${param.error}" class="text-danger mt-2">
                로그인 실패. 아이디/비밀번호를 확인하세요.
              </div>
              <div th:if="${param.logout}" class="text-success mt-2">
                로그아웃 되었습니다.
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
      integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
