<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/common :: head('유저 관리')">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User View</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav
      class="navbar navbar-expand-lg bg-dark"
      th:replace="fragments/common :: navibar"
    >
      <div class="container">
        <a class="navbar-brand text-white" href="/admin">K-FreeMarket</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active text-white"
                aria-current="page"
                href="/admin"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="/admin/users">유저</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="/admin/products">상품</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="/admin/products/events"
                >이벤트</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container p-5">
      <!-- ✅ 성공 메시지 -->
      <div id="success-alert"
           th:if="${message}"
           class="alert alert-success"
           th:text="${message}">
      </div>

      <!-- ✅ 실패 메시지 -->
      <div id="error-alert"
           th:if="${error}"
           class="alert alert-danger"
           th:text="${error}">
      </div>

      <h1 class="">유저 관리</h1>
      <div class="text-end">
        총 건수 : <span th:text="${users.totalElements}">0</span>
      </div>
      <form
        class="row g-3 d-flex justify-content-center"
        method="GET"
        th:action="@{/admin/users}"
      >
        <div class="col-4">
          <label for="searchText" class="visually-hidden">검색</label>
          <input
            type="text"
            class="form-control"
            id="searchText"
            name="searchText"
            th:value="${param.searchText}"
          />
        </div>
        <div class="col-auto">
          <select class="form-select" name="sort" onchange="this.form.submit()">
            <option th:value="idAsc" th:selected="${sort} == 'idAsc'">ID 오름차순</option>
            <option th:value="idDesc" th:selected="${sort} == 'idDesc'">ID 내림차순</option>
            <option th:value="nameAsc" th:selected="${sort} == 'nameAsc'">이름 오름차순</option>
          </select>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-dark mb-3">검색</button>
        </div>
        <div class="col-auto">
          <a class="btn btn-secondary mb-3" href="/admin/users">초기화</a>
        </div>
      </form>

      <table class="table table-striped">
        <thead class="table-dark">
          <tr>
            <th scope="col" class="text-center align-middle">번호</th>
            <th scope="col" class="text-center align-middle">이름</th>
            <th scope="col" class="text-center align-middle">권한</th>
            <th scope="col" class="text-center align-middle">전화번호</th>
            <th scope="col" class="text-center align-middle">주소</th>
            <th scope="col" class="text-center align-middle">이메일</th>
            <th scope="col" class="text-center align-middle">삭제</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <th th:text="${user.id}" class="text-center align-middle">1</th>
            <td class="text-center align-middle"  th:text="${user.name}">이름</td>
            <td th:text="${user.userRole}" class="text-center align-middle">권한</td>
            <td th:text="${user.mobileNumber}" class="text-center align-middle">핸드폰 번호</td>
            <td th:text="${user.address}" class="text-center align-middle">주소</td>
            <td th:text="${user.email}" class="text-center align-middle">이메일</td>
            <td>
              <form th:action="@{/admin/user(userId=${user.id})}" class="text-center align-middle" method="post">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm align-middle text-center">
                  삭제
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <a
              class="page-link"
              href="#"
              th:classappend="${1 == users.pageable.pageNumber + 1} ? 'disabled'"
              th:href="@{/admin/users(page=${users.pageable.pageNumber - 1}, searchText = ${param.searchText}, sort=${sort})}"
              >&lt;</a
            >
          </li>
          <li
            class="page-item"
            th:classappend="${i == users.pageable.pageNumber + 1} ? 'disabled'"
            th:each="i : ${#numbers.sequence(startPage, endPage)}"
          >
            <a
              class="page-link"
              href="#"
              th:text="${i}"
              th:href="@{/admin/users(page=${i - 1}, searchText = ${param.searchText}, sort=${sort})}"
              >1</a
            >
          </li>
          <li
            class="page-item"
            th:classappend="${users.totalPages == users.pageable.pageNumber + 1} ? 'disabled'"
          >
            <a
              class="page-link"
              href="#"
              th:href="@{/admin/users(page=${users.pageable.pageNumber + 1}, searchText = ${param.searchText}, sort=${sort})}"
              >&gt;</a
            >
          </li>
        </ul>
      </nav>

    </main>

    <footer class="mt-auto" th:replace="fragments/common :: footer"></footer>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const successAlert = document.getElementById("success-alert");
        const errorAlert = document.getElementById("error-alert");

        if (successAlert) {
          setTimeout(() => successAlert.style.display = "none", 3000);
        }

        if (errorAlert) {
          setTimeout(() => errorAlert.style.display = "none", 3000);
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
      integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
